<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .strength {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .weak { color: red; }
        .moderate { color: orange; }
        .strong { color: green; }
        .very-strong { color: blue; }
    </style>
</head>
<body>

    <h2>Password Strength Checker</h2>
    <input type="password" id="password" placeholder="Enter password..." oninput="checkPasswordStrength()">
    <p class="strength" id="strength-text">Strength: </p>

    <script>
        function checkPasswordStrength() {
            let password = document.getElementById("password").value;
            let strengthText = document.getElementById("strength-text");

            fetch("http://127.0.0.1:5000/check-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ password: password })
            })
            .then(response => response.json())
            .then(data => {
                strengthText.innerHTML = `Strength: ${data.strength}`;
                strengthText.className = "strength " + data.strength.toLowerCase().replace(" ", "-");
            })
            .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
